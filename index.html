<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf7f4">
<title>食刻 · 学生饮食打卡</title>
<script>window.__shikeErrs=[];window.addEventListener('error',function(e){window.__shikeErrs.push('error: '+e.message);});window.addEventListener('unhandledrejection',function(e){window.__shikeErrs.push('rejection: '+String(e.reason));});(function(){var w=console.warn,e=console.error;console.warn=function(){window.__shikeErrs.push('warn: '+Array.prototype.join.call(arguments,' '));return w.apply(console,arguments);};console.error=function(){window.__shikeErrs.push('error: '+Array.prototype.join.call(arguments,' '));return e.apply(console,arguments);};})();</script>
<style>
/* 食刻 · 样式（离线，无外部字体/图片） */
:root {
  --bg: #fdf7f4;
  --card: #ffffff;
  --ink: #40303a;
  --ink2: #8b7681;
  --ink3: #bcaab2;
  --pink: #ff9ec1;
  --pink-d: #ef6d97;
  --pink-deep: #d9517a;
  --pink-soft: #ffe6ef;
  --pink-line: #f8d6e2;
  --cream: #fdf6f1;
  --carb: #a9d6f5;
  --prot: #ffd98a;
  --fat: #ffaec4;
  --warn: #f5854f;
  --warn-bg: #fff3ec;
  --ok: #6ec1a4;
  --ok-bg: #eaf8f2;
  --r: 24px;
  --shadow: 0 12px 26px rgba(240, 158, 188, .16);
  --shadow-sm: 0 6px 16px rgba(240, 158, 188, .12);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  color: var(--ink);
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(241, 200, 214, .22) 1px, transparent 1px),
    linear-gradient(90deg, rgba(241, 200, 214, .22) 1px, transparent 1px);
  background-size: 27px 27px;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
}
button { font-family: inherit; font-size: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 3px solid #ff9ec1; outline-offset: 2px; border-radius: 12px; }

/* ---------- 手机列 ---------- */
.phone {
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 0 14px 116px;
  position: relative;
}

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 8px;
  padding: 12px 2px 10px;
  background: linear-gradient(180deg, var(--bg) 62%, rgba(253, 247, 244, .0));
}
.bar-cell { flex: 1 1 0; display: flex; align-items: center; min-width: 0; }
.bar-cell.mid { justify-content: center; }
.bar-cell.right { justify-content: flex-end; }
.title-pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 7px 18px; border-radius: 999px;
  background: #ffd7e6; border: none; color: #4b3340;
  font-size: 19px; font-weight: 700; letter-spacing: .5px;
  box-shadow: 0 4px 12px rgba(240, 158, 188, .22);
  cursor: pointer; max-width: 100%; white-space: nowrap;
}
.title-pill.static { cursor: default; }
.bar-cell.mid { flex: 0 1 auto; }
.title-pill .caret { font-size: 11px; color: #b9678a; }
.chip-ghost {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 11px; border-radius: 999px; cursor: pointer;
  background: #fff; border: 1px solid var(--pink-line);
  color: #b0567c; font-size: 12px; font-weight: 600;
  box-shadow: var(--shadow-sm); white-space: nowrap;
}
.chip-ghost:active { transform: scale(.97); }
.mascot { font-size: 26px; line-height: 1; }
.mascot svg { display: block; }
.daypick {
  display: flex; gap: 8px; justify-content: center;
  margin: 0 0 10px; flex-wrap: wrap;
}
.daypick button {
  border: 1px solid var(--pink-line); background: #fff; color: #a2547a;
  border-radius: 999px; padding: 5px 14px; font-size: 13px; cursor: pointer;
}
.daypick button.on { background: #ffd7e6; border-color: #ffbfd6; font-weight: 700; }

/* ---------- 卡片 ---------- */
.view { display: flex; flex-direction: column; gap: 14px; }
.card {
  background: var(--card);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 18px 16px;
}
.card.soft { background: #fffafc; }
.card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.card-title { font-size: 18px; font-weight: 800; letter-spacing: .3px; }
.card-title .uline { display: block; height: 4px; border-radius: 3px; background: #ffd0e0; margin-top: 2px; }
.dash { height: 1px; border-top: 1px dashed var(--pink-line); margin: 14px 0; }
.muted { color: var(--ink2); font-size: 12.5px; }
.tiny { color: var(--ink3); font-size: 11.5px; }
.section-title { font-size: 15px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }

/* ---------- 今日总览 ---------- */
.hero { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.hero-side { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 96px; }
.hero-side .lab { font-size: 13px; font-weight: 700; color: #5a424e; }
.hero-side .num { font-size: 30px; font-weight: 800; line-height: 1.05; letter-spacing: -.5px; }
.hero-side .unit { font-size: 12px; color: var(--ink2); }
.hero-emo { font-size: 22px; }
.ring-wrap { position: relative; width: 150px; height: 150px; flex: 0 0 auto; }
.ring { width: 150px; height: 150px; display: block; }
.ring circle { fill: none; stroke-width: 13; stroke-linecap: round; }
.ring .trk { stroke: #f2f3f7; }
.ring .fil { transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .5s ease; }
.ring-center {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; gap: 1px;
}
.ring-center .rl { font-size: 12px; color: #e084a6; font-weight: 700; }
.ring-center .rn { font-size: 38px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
.ring-center .rs { font-size: 10.5px; color: #b9a3ac; }

.macros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.macro { min-width: 0; }
.macro .ml { font-size: 13.5px; font-weight: 700; }
.mbar { height: 9px; border-radius: 999px; background: #f1eef2; overflow: hidden; margin: 7px 0 6px; }
.mbar i { display: block; height: 100%; border-radius: 999px; }
.macro .mv { font-size: 12px; color: var(--ink2); white-space: nowrap; }

/* ---------- 打卡 ---------- */
.seg { margin-left: auto; display: flex; gap: 6px; }
.seg button {
  border: none; border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 700;
  background: #fff5f9; color: #c07f9c; cursor: pointer;
}
.seg button.on { background: #ffd0e1; color: #a63e69; }
.meal { margin-top: 6px; }
.meal + .meal { margin-top: 4px; }
.meal-head { display: flex; align-items: center; gap: 8px; padding: 8px 2px; }
.meal-head .me { font-size: 20px; }
.meal-head h3 { font-size: 17px; font-weight: 800; }
.meal-head .mk { margin-left: auto; font-size: 13px; color: var(--pink-d); font-weight: 700; }
.food-list { display: flex; flex-direction: column; gap: 10px; }
.food-row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--cream); border: none; border-radius: 18px;
  padding: 12px 14px; cursor: pointer;
}
.food-row:active { background: #fbf0e8; }
.tile {
  width: 42px; height: 42px; flex: 0 0 42px; border-radius: 13px;
  background: #fff; display: grid; place-items: center; font-size: 23px;
  box-shadow: inset 0 0 0 1px #f7ece5;
}
.f-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.f-name { font-size: 15.5px; font-weight: 700; }
.f-sub { font-size: 12.5px; color: #7b6570; }
.f-sub b { color: #3f3038; }
.chev { margin-left: auto; color: #e3aec5; font-size: 20px; }
.flagrow { display: flex; flex-wrap: wrap; gap: 6px; }
.flag {
  font-size: 10.5px; font-weight: 700; border-radius: 8px; padding: 2px 7px;
  display: inline-flex; align-items: center; gap: 3px; white-space: nowrap;
}
.flag.lv3 { background: #ffe1d6; color: #c8512a; }
.flag.lv2 { background: #ffe3ec; color: #c03f74; }
.flag.lv1 { background: #fff2e0; color: #b9791f; }
.flag.ok { background: var(--ok-bg); color: #3d8f74; }

/* ---------- 风险卡 ---------- */
.risk-card { background: #fffaf7; }
.risk-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.risk-counts { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.risk-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px dashed var(--pink-line); }
.risk-row:first-of-type { border-top: none; }
.risk-row .rr-main { min-width: 0; }
.risk-row .rr-n { font-size: 13.5px; font-weight: 700; }
.risk-row .rr-t { font-size: 12px; color: var(--ink2); }
.empty { text-align: center; color: var(--ink3); font-size: 13px; padding: 14px 0; }

/* ---------- 记录页 ---------- */
.ta {
  width: 100%; min-height: 92px; resize: vertical; display: block;
  border-radius: 16px; border: 1px solid var(--pink-line); background: #fffdfe;
  padding: 12px 13px; font-size: 14.5px; line-height: 1.6; color: var(--ink);
  font-family: inherit;
}
.ta::placeholder { color: #c9b3bd; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.chip {
  border: 1px solid var(--pink-line); background: #fff; border-radius: 999px;
  padding: 6px 12px; font-size: 12.5px; color: #a2547a; cursor: pointer; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chip.on { background: #ffd9e7; border-color: #ffbfd6; font-weight: 700; }
.btn {
  border: none; border-radius: 999px; padding: 12px 20px; font-size: 15px; font-weight: 800;
  cursor: pointer; width: 100%;
}
.btn.primary { background: linear-gradient(135deg, #ffb6d2, #ff90ba); color: #fff; box-shadow: 0 10px 20px rgba(255, 144, 186, .32); }
.btn.ghost { background: #fff5f9; color: #b0567c; }
.btn.line { background: #fff; border: 1px solid var(--pink-line); color: #a2547a; }
.btn:disabled { opacity: .75; cursor: default; }
.btn.sm { width: auto; padding: 8px 16px; font-size: 13px; }
.row2 { display: flex; gap: 10px; flex-wrap: wrap; }

.draft {
  margin-top: 2px;
  background: #fff9fc; border-radius: var(--r); padding: 14px 14px 16px;
  box-shadow: var(--shadow-sm); border: 1px solid #ffeef5;
}
.draft-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dtag {
  background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 12.5px;
  color: #a2547a; font-weight: 700; box-shadow: var(--shadow-sm);
}
.draft .food-list { margin-top: 10px; }
.draft-foot { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.draft-foot .sum { color: var(--pink-d); font-weight: 800; font-size: 14px; }
.draft-foot .sum small { color: var(--ink2); font-weight: 600; }
.ai-note { text-align: right; color: #bfa8b3; font-size: 11px; margin-top: 8px; }

/* ---------- 配餐 ---------- */
.badge-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.badge {
  display: inline-flex; align-items: center; gap: 5px; border-radius: 999px;
  padding: 5px 12px; font-size: 12px; font-weight: 800;
}
.badge.ok { background: var(--ok-bg); color: #2f8168; }
.badge.warn { background: #fff2e6; color: #b5762c; }
.badge.pink { background: #ffe6ef; color: #b0567c; }
.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.slot {
  background: var(--cream); border-radius: 18px; padding: 12px; min-width: 0;
}
.slot .sl { font-size: 11px; font-weight: 800; color: #c07f9c; letter-spacing: .5px; }
.slot .sn { display: flex; align-items: center; gap: 6px; font-size: 14.5px; font-weight: 700; margin: 4px 0 2px; }
.slot .sn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .sv { font-size: 12px; color: var(--ink2); }
.total-box { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.total-box .big { font-size: 34px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
.total-box .goal { font-size: 12.5px; color: var(--ink2); padding-bottom: 4px; }
.tbar { height: 10px; border-radius: 999px; background: #f1eef2; overflow: hidden; margin-top: 10px; }
.tbar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #ffc2d8, #ff8fb8); }
.tbar.over i { background: linear-gradient(90deg, #ffc8a8, #f5854f); }
.dish-row {
  display: flex; align-items: center; gap: 10px; padding: 11px 0;
  border-top: 1px dashed var(--pink-line);
}
.dish-row:first-of-type { border-top: none; }
.dish-main { min-width: 0; flex: 1 1 auto; }
.dish-n { font-size: 14.5px; font-weight: 700; }
.dish-r { font-size: 11.5px; color: var(--ink2); }
.dish-meta { text-align: right; font-size: 12px; color: var(--ink2); white-space: nowrap; }
.dish-meta b { display: block; color: #d9517a; font-size: 13px; }
.warn-box { background: var(--warn-bg); border-radius: 16px; padding: 12px 13px; display: flex; gap: 10px; }
.warn-box .we { font-size: 20px; }
.warn-box .wt { font-size: 13.5px; font-weight: 800; color: #bf5326; }
.warn-box p { font-size: 12px; color: #a8654a; margin-top: 2px; }

/* ---------- 周报 ---------- */
.chart { position: relative; margin-top: 6px; }
.bars { position: relative; height: 136px; display: flex; align-items: flex-end; gap: 7px; }
.vals { display: flex; gap: 7px; margin-bottom: 4px; }
.bval {
  flex: 1 1 0; min-width: 0; height: 12px; line-height: 12px; text-align: center;
  overflow: hidden; font-size: 9.5px; font-weight: 700; color: var(--ink3);
}
.bcol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
.bfill { width: 100%; max-width: 26px; border-radius: 9px 9px 6px 6px; background: linear-gradient(180deg, #ffc9dd, #ffa8c9); }
.bfill.over { background: linear-gradient(180deg, #ffd3ae, #f79a63); }
.bfill.today { background: linear-gradient(180deg, #ff9ec1, #f0679b); }
.tline { position: absolute; left: 0; right: 0; border-top: 2px dashed #b7d7c5; }
.tline span {
  position: absolute; right: 0; top: -16px; font-size: 10px; color: #5f9c82;
  background: #eef8f2; border-radius: 6px; padding: 1px 5px;
}
.xlab { display: flex; gap: 7px; margin-top: 6px; }
.xlab span { flex: 1 1 0; text-align: center; font-size: 11px; color: var(--ink2); min-width: 0; }
.xlab span.on { color: #d9517a; font-weight: 800; }
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.metric { background: var(--cream); border-radius: 18px; padding: 12px; min-width: 0; }
.metric .mt { font-size: 11.5px; color: var(--ink2); }
.metric .mn { font-size: 23px; font-weight: 800; line-height: 1.2; letter-spacing: -.5px; }
.metric .mn small { font-size: 11.5px; font-weight: 600; color: var(--ink2); margin-left: 2px; }
.struct + .struct { margin-top: 10px; }
.struct-top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 5px; }
.struct-top b { font-weight: 800; }
.sbar { height: 9px; border-radius: 999px; background: #f2eff3; overflow: hidden; }
.sbar i { display: block; height: 100%; border-radius: 999px; }
.tips { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.tips li { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.tips .no {
  flex: 0 0 22px; width: 22px; height: 22px; border-radius: 50%; background: #ffd9e7;
  color: #b0567c; font-size: 12px; font-weight: 800; display: grid; place-items: center;
}
.comment { background: #fff6fa; border-radius: 18px; padding: 13px; display: flex; gap: 10px; }
.comment .ce { font-size: 24px; }
.comment p { font-size: 13px; color: #6c5763; }

/* ---------- 提醒 ---------- */
.remind-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px dashed var(--pink-line); }
.remind-row:first-of-type { border-top: none; }
.remind-row .re { font-size: 22px; }
.remind-main { min-width: 0; flex: 1 1 auto; }
.remind-main .rn { font-size: 15px; font-weight: 800; }
.remind-main .rt { font-size: 11.5px; color: var(--ink2); }
.time-in {
  border: 1px solid var(--pink-line); border-radius: 12px; background: #fffafc;
  padding: 7px 9px; font-size: 14px; color: #7b4a61; font-family: inherit; width: 104px;
}
.switch {
  border: none; width: 50px; height: 29px; border-radius: 999px; background: #f0e7ec;
  position: relative; cursor: pointer; flex: 0 0 50px; transition: background .18s;
}
.switch::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 23px; height: 23px;
  border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(240, 158, 188, .45);
  transition: transform .18s;
}
.switch[aria-checked="true"] { background: linear-gradient(135deg, #ffb3d0, #ff8bb6); }
.switch[aria-checked="true"]::after { transform: translateX(21px); }
.setting-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px dashed var(--pink-line); }
.setting-row .sm { flex: 1 1 auto; min-width: 0; }
.setting-row .sm b { font-size: 14px; }
.setting-row .sm p { font-size: 11.5px; color: var(--ink2); }
.confirm-box { background: #fff5f9; border-radius: 16px; padding: 12px; margin-top: 10px; }
.confirm-box p { font-size: 13px; font-weight: 700; color: #b0567c; margin-bottom: 10px; }

/* ---------- 营养师后台 ---------- */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--cream); border-radius: 18px; padding: 12px 10px; text-align: center; min-width: 0; }
.stat .sn { font-size: 24px; font-weight: 800; line-height: 1.15; }
.stat .st { font-size: 11.5px; color: var(--ink2); }
.recipe { border-radius: 18px; background: #fffafc; padding: 12px; border: 1px solid #ffeef5; }
.recipe + .recipe { margin-top: 10px; }
.recipe-top { display: flex; align-items: center; gap: 8px; }
.recipe-top b { font-size: 14.5px; }
.recipe-meta { display: flex; gap: 10px; font-size: 11.5px; color: var(--ink2); margin-top: 3px; flex-wrap: wrap; }
.recipe .rs { font-size: 12px; color: #7b6570; margin-top: 6px; }
.recipe-acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.mini {
  border: none; border-radius: 999px; padding: 7px 15px; font-size: 12.5px; font-weight: 800;
  cursor: pointer; background: #fff; box-shadow: var(--shadow-sm); color: #a2547a;
}
.mini.yes { background: linear-gradient(135deg, #ffb6d2, #ff90ba); color: #fff; }
.mini.no { background: #fff2f5; color: #c2456f; }
.mini.ghost { background: #f7f4f6; color: #8b7681; }
.rule-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px dashed var(--pink-line); }
.rule-row:first-of-type { border-top: none; }
.rule-row .rr { flex: 1 1 auto; min-width: 0; }
.rule-row b { font-size: 14px; }
.rule-row p { font-size: 11.5px; color: var(--ink2); }

/* ---------- 底部标签栏 ---------- */
.tabbar {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
  width: 100%; max-width: 430px; z-index: 30;
  display: flex; align-items: stretch;
  background: rgba(255, 255, 255, .97);
  border-radius: 26px 26px 0 0;
  box-shadow: 0 -8px 24px rgba(240, 158, 188, .18);
  padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px));
}
.tab {
  flex: 1 1 0; min-width: 0; border: none; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 4px 0; color: #b9a6ae; font-size: 11px;
}
.tab .ti { font-size: 20px; line-height: 1.1; opacity: .6; filter: grayscale(1) sepia(1) saturate(5) hue-rotate(302deg) brightness(1.06); }
.tab.on { color: var(--pink-deep); font-weight: 800; }
.tab.on .ti { opacity: 1; transform: translateY(-1px); }
.tab.on::after { content: ''; width: 16px; height: 3px; border-radius: 3px; background: #ffb0cd; margin-top: 1px; }
.tab:not(.on)::after { content: ''; height: 3px; margin-top: 1px; }

/* ---------- 提示条 ---------- */
.toast {

  /* ---------- 一句话解析 ---------- */
  var LABEL = { '早饭': '早餐', '午餐': '午餐', '午饭': '午餐', '中饭': '午餐', '晚餐': '晚餐', '晚饭': '晚餐', '早餐': '早餐', '加餐': '加餐', '夜宵': '加餐' };
  var CN = { '一': 1, '二': 2, '两': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10, '半': 0.5 };
  var QTY_RE = /([一二两三四五六七八九十半]|\d+(?:\.\d+)?)\s*(杯|个|只|碗|份|盒|根|片|块|把|勺|瓶|袋|颗|条|包|克|g|G|ML|ml|毫升)?/;

  function guessMeal() {
    var h = new Date().getHours();
    if (h < 10) return '早餐';
    if (h < 15) return '午餐';
    if (h < 17) return '加餐';
    if (h < 21) return '晚餐';
    return '加餐';
  }
  function splitItems(body) {
    return String(body || '')
      .replace(/＋/g, '+')
      .split(/[+、,，;；|]|以及|和(?=[一二两三四五六七八九十半\d])|再(?=[一二两三四五六七八九十半\d])/)
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });
  }
  function parseItem(chunk) {
    var s = String(chunk).replace(/^(吃了|喝了|吃|喝|有|来)/, '').trim();
    if (!s) return null;
    var m = QTY_RE.exec(s);
    var qty = 1, unit = '', nameText = s;
    if (m) {
      qty = CN[m[1]] != null ? CN[m[1]] : parseFloat(m[1]);
      unit = m[2] || '';
      nameText = (s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length)).replace(/\s+/g, '');
      if (!nameText) nameText = s;
    }
    var food = matchFood(nameText) || matchFood(s);
    if (food) return makeItem(food, qty, unit);
    return estimateItem(nameText || s, qty, unit);
  }
  function parseSentence(text) {
    var raw = String(text || '').trim();
    if (!raw) return [];
    var groups = [];
    var re = /(早餐|午餐|晚餐|加餐|早饭|午饭|中饭|晚饭|夜宵)\s*[:：]?/g;
    var m, last = null;
    while ((m = re.exec(raw)) !== null) {
      if (last) last.body = raw.slice(last.from, m.index);
      last = { meal: LABEL[m[1]] || m[1], from: re.lastIndex, body: '' };
      groups.push(last);
      if (re.lastIndex >= raw.length) break;
    }
    if (last) last.body = raw.slice(last.from);
    if (!groups.length) groups = [{ meal: guessMeal(), body: raw }];
    var out = [];
    groups.forEach(function (g) {
      var items = splitItems(g.body).map(parseItem).filter(Boolean);
      if (items.length) out.push({ meal: g.meal, items: items, kcal: r0(items.reduce(function (a, b) { return a + b.kcal; }, 0)) });
    });
    return out;
  }

  /* ---------- 风险扫描 ---------- */
  /* 天然水果/薯类的糖不算「添加糖」，只对加工类食物计风险 */
  function addSugarOf(it) { return it.proc === 'natural' ? 0 : it.sugar; }
  function riskOf(it) {
    var out = [], as = addSugarOf(it);
    if (as >= 25) out.push({ kind: '高糖', level: 3, text: D.riskNotes.sugarHigh + '（添加糖约' + fmt(as) + '克）' });
    else if (as >= 15) out.push({ kind: '高糖', level: 2, text: D.riskNotes.sugarMid + '（添加糖约' + fmt(as) + '克）' });
    if (it.oil >= 3) out.push({ kind: '高油', level: 3, text: D.riskNotes.oilHigh + '（约' + fmt(it.fat) + '克脂肪）' });
    else if (it.oil === 2) out.push({ kind: '高油', level: 1, text: D.riskNotes.oilMid });
    if (it.proc === 'ultra') out.push({ kind: '超加工', level: 2, text: D.riskNotes.ultraMid });
    return out;
  }
  function groupRisks(items) {
    var out = [];
    items.forEach(function (it) {
      riskOf(it).forEach(function (r) { out.push({ item: it.name, kind: r.kind, level: r.level, text: r.text }); });
    });
    return out;
  }

  /* ---------- 汇总 ---------- */
  function itemsTotals(items) {
    var t = { kcal: 0, carb: 0, protein: 0, fat: 0, sugar: 0, asugar: 0 };
    items.forEach(function (it) {
      t.kcal += it.kcal; t.carb += it.carb; t.protein += it.protein; t.fat += it.fat;
      t.sugar += it.sugar; t.asugar += addSugarOf(it);
    });
    t.kcal = r0(t.kcal); t.carb = r1(t.carb); t.protein = r1(t.protein); t.fat = r1(t.fat);
    t.sugar = r1(t.sugar); t.asugar = r1(t.asugar);
    return t;
  }
  function emptyDay() { return { meals: { '早餐': [], '午餐': [], '晚餐': [], '加餐': [] }, ex: 0 }; }
  function dayTotals(day) {
    day = day || emptyDay();
    var t = { kcal: 0, carb: 0, protein: 0, fat: 0, sugar: 0, asugar: 0, ex: day.ex || 0, meals: {}, flags: [] };
    MEALS.forEach(function (meal) {
      var items = (day.meals && day.meals[meal]) || [];
      var s = itemsTotals(items);
      s.items = items;
      t.meals[meal] = s;
      t.kcal += s.kcal; t.carb += s.carb; t.protein += s.protein; t.fat += s.fat; t.sugar += s.sugar; t.asugar += s.asugar;
      groupRisks(items).forEach(function (r) { r.meal = meal; t.flags.push(r); });
    });
    t.kcal = r0(t.kcal); t.carb = r1(t.carb); t.protein = r1(t.protein); t.fat = r1(t.fat); t.sugar = r1(t.sugar); t.asugar = r1(t.asugar);
    t.left = Math.max(0, D.targets.kcal + t.ex - t.kcal);
    t.ratio = Math.min(1, t.kcal / (D.targets.kcal + t.ex));
    return t;
  }
  function riskSummary(totals) {
    var c = { '高糖': 0, '高油': 0, '超加工': 0 };
    totals.flags.forEach(function (f) { if (c[f.kind] != null) c[f.kind] += 1; });
    return { counts: c, total: totals.flags.length, list: totals.flags, sugar: totals.asugar };
  }

  /* ---------- 配餐 ---------- */
  function reasonOf(f) {
    if (f.tags.indexOf('蔬菜') >= 0 && f.oil <= 1) return '清淡蔬菜，补纤维几乎不加油';
    if (f.tags.indexOf('乳制品') >= 0) return '补钙又饱腹，比甜饮料更适合加餐';
    if (f.tags.indexOf('高纤维') >= 0) return '粗粮主食，升糖更平缓、更扛饿';
    if (f.tags.indexOf('水果') >= 0) return '天然水果，替代甜饮料解腻';
    if (f.oil >= 3) return '口味满足，但油脂偏高，一周别超过一次';
    if (f.protein >= 20) return '高蛋白，补上这一餐的蛋白缺口';
    if (f.kcal <= 200) return '热量友好的配菜，不占这一餐的额度';
    return '热量适中，适合和主菜搭配';
  }
  function scoreOf(f, rules) {
    if (rules.ultraProcessBlock && f.proc === 'ultra') return -999;
    var s = 50 + f.protein * 1.2 - f.fat * 0.5 - f.sugar * 0.4 - f.oil * 6;
    if (rules.proteinFirst) s += f.protein * 1.2;
    if (rules.highOilDownweight) s -= f.oil * 9;
    if (rules.canteenFirst && f.price > 0) s += 6;
    return s;
  }
  function pairPlan(text, rules) {
    var wanted = String(text || '').trim();
    var mainFood = matchFood(wanted);
    var main = mainFood ? makeItem(mainFood, 1, mainFood.unit) : estimateItem(wanted || '想吃的菜', 1, '份');
    rules = rules || {};
    var heavy = main.kcal > 350;
    var spec = [
      { label: '主食', id: main.oil >= 3 ? 'corn' : (main.proc === 'ultra' ? 'multigrain' : 'rice'), grams: heavy ? 100 : 150 },
      { label: '蛋白质', id: main.protein >= 18 ? 'egg' : 'chickenBreast', grams: main.protein >= 18 ? (heavy ? 55 : 110) : 120 },
      { label: '蔬菜', id: main.oil >= 2 ? 'broccoli' : 'greens', grams: 150 },
      { label: '水果·乳制品', id: main.sugar >= 20 ? 'cherry' : 'apple', grams: heavy ? 100 : 150 }
    ];
    var slots = spec.map(function (s) {
      var f = BY_ID[s.id];
      if (rules.ultraProcessBlock && f.proc === 'ultra') f = BY_ID.apple;
      return { label: s.label, item: itemFromGrams(f, s.grams) };
    });
    var slotKcal = slots.reduce(function (a, b) { return a + b.item.kcal; }, 0);
    var total = r0(main.kcal + slotKcal);
    var target = D.mealTargets['午餐'];
    var ranked = D.foods.filter(function (f) { return f.price > 0 && f.id !== main.foodId; })
      .map(function (f) { return { f: f, s: scoreOf(f, rules) }; })
      .filter(function (x) { return x.s > -900; })
      .sort(function (a, b) { return b.s - a.s; });
    var picked = [], seen = {};
    ranked.forEach(function (x) {
      var why = reasonOf(x.f);
      if (picked.length < 4 && !seen[why]) { seen[why] = 1; picked.push(x.f); }
    });
    ranked.forEach(function (x) {
      if (picked.length < 4 && picked.indexOf(x.f) < 0) picked.push(x.f);
    });
    var pool = picked.slice(0, 4).map(function (f) {
      return { id: f.id, name: f.name, emoji: f.emoji, price: f.price, kcal: f.kcal, oil: f.oil, reason: reasonOf(f) };
    });
    var notes = [];
    if (main.oil >= 3) notes.push('主菜属油炸/重油，已把主食减半并换成粗粮，蔬菜选水煮西兰花');
    else if (main.oil === 2) notes.push('主菜烹调油偏多，蔬菜换成低油的西兰花来平衡');
    if (total > target) notes.push('这一餐合计比目标高 ' + (total - target) + ' 千卡，建议当天其余餐次清淡、少含糖饮料');
    else notes.push('这一餐合计在目标以内，蛋白质与蔬菜都齐了');
    if (rules.ultraProcessBlock && main.proc === 'ultra') notes.push('「超加工食材拦截」已开启，主菜热量按普通菜品口径估算');
    return {
      main: main, slots: slots, slotKcal: slotKcal, total: total, target: target, diff: total - target,
      canteen: pool, notes: notes, risks: groupRisks([main])
    };
  }

  /* ---------- 周报 ---------- */
  function weekly(state) {
    var days = [], sum = { kcal: 0, carb: 0, protein: 0, fat: 0, sugar: 0 }, proteinOk = 0, flags = 0, sugarDays = 0;
    for (var i = -6; i <= 0; i++) {
      var key = dateKey(i);
      var t = dayTotals(state.days[key]);
      days.push({ key: key, label: i === 0 ? '今天' : weekday(i), date: convDate(i), kcal: t.kcal, carb: t.carb, protein: t.protein, fat: t.fat, sugar: t.sugar, addSugar: t.asugar, flags: t.flags.length, isToday: i === 0 });
      sum.kcal += t.kcal; sum.carb += t.carb; sum.protein += t.protein; sum.fat += t.fat; sum.sugar += t.asugar;
      if (t.protein >= D.targets.protein) proteinOk += 1;
      flags += t.flags.length;
      if (t.asugar >= 25) sugarDays += 1;
    }
    var avg = r0(sum.kcal / 7);
    var prev = (state.profile && state.profile.lastWeekAvg) || 1352;
    var vsWeek = Math.round((avg - prev) / prev * 100);
    var eCarb = sum.carb * 4, eProt = sum.protein * 4, eFat = sum.fat * 9;
    var eSum = eCarb + eProt + eFat || 1;
    var structure = [
      { name: '碳水供能', pct: Math.round(eCarb / eSum * 100), band: '50~65%', color: 'var(--carb)' },
      { name: '蛋白质供能', pct: Math.round(eProt / eSum * 100), band: '10~20%', color: 'var(--prot)' },
      { name: '脂肪供能', pct: Math.round(eFat / eSum * 100), band: '20~30%', color: 'var(--fat)' }
    ];
    var pool = [];
    if (structure[0].pct > 65) pool.push('碳水供能占比偏高，把一碗白米饭换成半碗米饭＋一根玉米试试');
    if (structure[1].pct < 15) pool.push('蛋白质供能偏少，每餐加一个鸡蛋或一杯无糖酸奶，一天就能补 15 克');
    if (proteinOk < 5) pool.push('本周只有 ' + proteinOk + ' 天蛋白质达标，早餐建议固定「蛋＋奶」组合');
    if (flags >= 6) pool.push('高糖高油标记 ' + flags + ' 次，先把奶茶从每天一杯改成每周两杯');
    if (sugarDays >= 3) pool.push('有 ' + sugarDays + ' 天添加糖超过 25 克，含糖饮料换成无糖茶或气泡水');
    if (avg > D.targets.kcal + 120) pool.push('平均摄入比推荐值高 ' + (avg - D.targets.kcal) + ' 千卡，晚餐主食减 1/3 最容易坚持');
    if (avg < D.targets.kcal - 250) pool.push('平均摄入偏低，容易晚上饿，加餐可以放一杯牛奶或一把坚果');
    var fallback = ['每天固定吃一份深绿色蔬菜，一周就能多补膳食纤维', '把 30 分钟快走写进课表，和吃饭时间绑在一起更容易坚持', '食堂打菜先素后荤，餐盘一半留给蔬菜'];
    fallback.forEach(function (s) { if (pool.length < 3) pool.push(s); });
    var suggestions = pool.slice(0, 3);
    var tone = avg > D.targets.kcal ? '略高于' : '略低于';
    var comment = '这一周平均每天 ' + avg + ' 千卡，' + tone + '推荐摄入（' + D.targets.kcal + ' 千卡）。' +
      (flags >= 5 ? '高糖高油的次数偏多，' : '整体油脂控制得还不错，') +
      (proteinOk >= 4 ? '蛋白质达标 ' + proteinOk + ' 天，继续保持。' : '蛋白质达标只有 ' + proteinOk + ' 天，明天早餐先加一个鸡蛋。') +
      '结构上碳水 ' + structure[0].pct + '%、蛋白质 ' + structure[1].pct + '%、脂肪 ' + structure[2].pct + '%，' +
      (structure[2].pct > 30 ? '脂肪偏高，点菜时避开「干煸、香锅、油炸」。' : '比例接近推荐区间。');
    return {
      days: days, avg: avg, prev: prev, vsWeek: vsWeek, proteinOk: proteinOk, flags: flags,
      sugar: r1(sum.sugar), structure: structure, suggestions: suggestions, comment: comment,
      target: D.targets.kcal
    };
  }

  /* ---------- 营养师后台 ---------- */
  function recipeStats(state) {
    var list = state.recipes || [], p = 0, a = 0, j = 0;
    list.forEach(function (r) {
      if (r.status === 'pending') p += 1;
      else if (r.status === 'approved') a += 1;
      else j += 1;
    });
    return { pending: p, approved: a, rejected: j, total: list.length, rate: (a + j) ? Math.round(j / (a + j) * 100) : 0 };
  }
  function badgeText(state) {
    var s = recipeStats(state);
    return '已通过 ' + s.approved + '/' + s.total + ' · 待审 ' + s.pending;
  }

  /* ---------- 持久化 ---------- */
  function dayFromPlan(plan) {
    var day = { meals: {}, ex: plan.ex || 0 };
    MEALS.forEach(function (m) {
      var list = (plan.meals && plan.meals[m]) || [];
      day.meals[m] = list.map(function (p) {
        var f = BY_ID[p[0]];
        return f ? makeItem(f, p[1], f.unit) : null;
      }).filter(Boolean);
    });
    return day;
  }
  function seedState() {
    var s = {
      v: D.version,
      profile: { name: D.profile.name, goal: D.profile.goal, lastWeekAvg: D.profile.lastWeekAvg },
      reminders: JSON.parse(JSON.stringify(D.reminders)),
      recipes: JSON.parse(JSON.stringify(D.recipeQueue)),
      rules: JSON.parse(JSON.stringify(D.rules)),
      days: {}
    };
    D.seedHistory.forEach(function (h) { s.days[dateKey(h.d)] = dayFromPlan(h); });
    s.days[dateKey(0)] = dayFromPlan(D.seedToday);
    return s;
  }
  function normalize(s) {
    var fresh = seedState();
    if (!s.profile) s.profile = fresh.profile;
    if (!s.reminders) s.reminders = fresh.reminders;
    if (!s.rules) s.rules = fresh.rules;
    if (!Array.isArray(s.recipes)) s.recipes = fresh.recipes;
    if (!s.days) s.days = {};
    var today = dateKey(0);
    if (!s.days[today]) s.days[today] = emptyDay();
    Object.keys(s.days).forEach(function (k) {
      var d = s.days[k] || {};
      if (!d.meals) d.meals = {};
      MEALS.forEach(function (m) { if (!Array.isArray(d.meals[m])) d.meals[m] = []; });
      if (typeof d.ex !== 'number') d.ex = 0;
      s.days[k] = d;
    });
    return s;
  }
  function loadState() {
    var raw = null;
    try { raw = window.localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.days) return normalize(parsed);
      } catch (e2) { /* 数据损坏则回落到种子数据 */ }
    }
    var fresh = seedState();
    saveState(fresh);
    return fresh;
  }
  function saveState(state) {
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 隐私模式下仅内存态 */ }
    return state;
  }
  function resetState() {
    var fresh = seedState();
    saveState(fresh);
    return fresh;
  }
  function dayOf(state, offset) { return state.days[dateKey(offset)] || emptyDay(); }

  return {
    MEALS: MEALS, KEY: KEY, r0: r0, r1: r1, fmt: fmt,
    dateKey: dateKey, weekday: weekday, convDate: convDate, dayLabel: dayLabel,
    matchFood: matchFood, makeItem: makeItem, itemFromGrams: itemFromGrams, estimateItem: estimateItem,
    parseSentence: parseSentence, parseItem: parseItem, riskOf: riskOf, groupRisks: groupRisks,
    itemsTotals: itemsTotals, dayTotals: dayTotals, riskSummary: riskSummary, emptyDay: emptyDay,
    pairPlan: pairPlan, weekly: weekly, recipeStats: recipeStats, badgeText: badgeText,
    seedState: seedState, loadState: loadState, saveState: saveState, resetState: resetState, dayOf: dayOf
  };
})();

</script>
<script>
/* app/ui.js */
/* 食刻 · 视图渲染与事件（经典脚本，无模块、无外部请求） */
(function () {
  var E = window.SHIKE.engine;
  var D = window.SHIKE.DATA;
  var TABS = [
    { id: 'today', label: '今天', icon: '🍚' },
    { id: 'log', label: '记录', icon: '📝' },
    { id: 'pair', label: '配餐', icon: '🍱' },
    { id: 'week', label: '周报', icon: '📊' },
    { id: 'remind', label: '提醒', icon: '⏰' }
  ];
  var MEAL_EMO = { '早餐': '🥛', '午餐': '🍚', '晚餐': '🍲', '加餐': '🍪' };
  var state = null;
  var RT = {
    tab: 'today', day: 0, dayPick: false, dash: 'meal',
    logText: '', draft: null, pairText: '', pair: null,
    resetAsk: false, rejectId: '', timer: 0
  };

  function $(sel) { return document.querySelector(sel); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    window.clearTimeout(RT.timer);
    RT.timer = window.setTimeout(function () { el.classList.remove('show'); }, 2400);
  }
  function save() { E.saveState(state); }
  function go(tab) { RT.tab = tab; RT.dayPick = false; paint(); }

  /* ---------- 顶栏与标签栏 ---------- */
  function topbar() {
    if (RT.tab === 'console') {
      return '<div class="bar-cell"><button class="chip-ghost" data-act="back" aria-label="返回今天页">← 返回</button></div>' +
        '<div class="bar-cell mid"><span class="title-pill">营养师后台</span></div>' +
        '<div class="bar-cell right"><span class="mascot">🧑‍🍳</span></div>';
    }
    var title = RT.tab === 'today' ? E.dayLabel(RT.day) : ({ log: '记录', pair: '配餐', week: '周报', remind: '提醒' })[RT.tab];
    var pill = RT.tab === 'today'
      ? '<button class="title-pill" data-act="daypick" aria-expanded="' + (RT.dayPick ? 'true' : 'false') + '" aria-label="切换查看日期，当前 ' + title + '">' + title + ' <span class="caret">▾</span></button>'
      : '<span class="title-pill">' + title + '</span>';
    return '<div class="bar-cell"><button class="chip-ghost" data-act="console">🧑‍🍳 营养师后台</button></div>' +
      '<div class="bar-cell mid">' + pill + '</div>' +
      '<div class="bar-cell right"><span class="mascot" aria-hidden="true">' + (RT.tab === 'today' ? '🐱' : '🍙') + '</span></div>';
  }
  function tabbar() {
    return TABS.map(function (t) {
      var on = RT.tab === t.id;
      return '<button class="tab' + (on ? ' on' : '') + '" data-act="tab" data-tab="' + t.id + '"' +
        ' aria-current="' + (on ? 'page' : 'false') + '"><span class="ti" aria-hidden="true">' + t.icon + '</span>' + t.label + '</button>';
    }).join('');
  }

  /* ---------- 公共片段 ---------- */
  function flagsOf(it) {
    var r = E.riskOf(it);
    return r.length ? '<span class="flagrow">' + r.map(function (x) {
      return '<span class="flag lv' + x.level + '">' + x.kind + '</span>';
    }).join('') + '</span>' : '';
  }
  function foodRow(it, meal, i) {
    return '<button class="food-row" data-act="food" data-meal="' + esc(meal) + '" data-i="' + i + '"' +
      ' aria-label="' + esc(it.name + ' ' + it.kcal + '千卡 ' + it.qty + it.unit + '，查看营养详情') + '">' +
      '<span class="tile" aria-hidden="true">' + it.emoji + '</span>' +
      '<span class="f-main"><span class="f-name">' + esc(it.name) + '</span>' +
      '<span class="f-sub"><b>' + it.kcal + '千卡</b> ' + esc(it.qty + it.unit) + '</span>' + flagsOf(it) + '</span>' +
      '<span class="chev" aria-hidden="true">›</span></button>';
  }
  function draftRow(it, meal, i) {
    return '<button class="food-row" data-act="dfood" data-meal="' + esc(meal) + '" data-i="' + i + '"' +
      ' aria-label="' + esc(it.name + ' 估算 ' + it.kcal + '千卡，查看详情') + '">' +
      '<span class="tile" aria-hidden="true">' + it.emoji + '</span>' +
      '<span class="f-main"><span class="f-name">' + esc(it.name) + (it.estimated ? ' <span class="flag lv1">未收录估算</span>' : '') + '</span>' +
      '<span class="f-sub"><b>' + it.kcal + '千卡</b> ' + esc(it.qty + it.unit) + '</span>' + flagsOf(it) + '</span>' +
      '<span class="chev" aria-hidden="true">›</span></button>';
  }
  function aiNote() { return '<p class="ai-note">内容由AI生成（本地营养知识库规则引擎）</p>'; }

  /* ---------- 今天 ---------- */
  function viewToday() {
    var day = E.dayOf(state, RT.day);
    var t = E.dayTotals(day);
    var rs = E.riskSummary(t);
    var tg = D.targets;
    var C = 2 * Math.PI * 50;
    var off = C * (1 - t.ratio);
    var macro = [
      { name: '碳水', val: t.carb, goal: tg.carb, color: 'var(--carb)' },
      { name: '蛋白质', val: t.protein, goal: tg.protein, color: 'var(--prot)' },
      { name: '脂肪', val: t.fat, goal: tg.fat, color: 'var(--fat)' }
    ].map(function (m) {
      var pct = m.goal ? Math.min(100, m.val / m.goal * 100) : 0;
      return '<div class="macro"><div class="ml">' + m.name + '</div>' +
        '<div class="mbar"><i style="width:' + pct.toFixed(1) + '%;background:' + m.color + '"></i></div>' +
        '<div class="mv">' + E.fmt(m.val) + '/' + E.fmt(m.goal) + '克</div></div>';
    }).join('');

    var html = '<section class="card"><div class="hero">' +
      '<div class="hero-side"><span class="hero-emo" aria-hidden="true">🍅</span><span class="lab">饮食摄入</span>' +
      '<span class="num">' + E.r0(t.kcal) + '</span><span class="unit">千卡</span></div>' +
      '<div class="ring-wrap"><svg class="ring" viewBox="0 0 120 120" role="img" aria-label="还可摄入 ' + E.r0(t.left) + ' 千卡，推荐摄入 ' + tg.kcal + ' 千卡">' +
      '<circle class="trk" cx="60" cy="60" r="50"></circle>' +
      '<circle class="fil" cx="60" cy="60" r="50" stroke="#ffa9c8" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '"></circle></svg>' +
      '<div class="ring-center"><span class="rl">还可摄入</span><span class="rn">' + E.r0(t.left) + '</span>' +
      '<span class="rs">推荐摄入' + tg.kcal + '千卡</span></div></div>' +
      '<div class="hero-side"><span class="hero-emo" aria-hidden="true">🏋️</span><span class="lab">运动消耗</span>' +
      '<span class="num">' + E.r0(t.ex) + '</span><span class="unit">千卡</span></div></div>' +
      '<div class="dash"></div><div class="macros">' + macro + '</div></section>';

    html += '<section class="card"><div class="card-head"><span class="mascot" aria-hidden="true">🐱</span>' +
      '<div><h2 class="card-title">饮食打卡<span class="uline"></span></h2></div>' +
      '<div class="seg"><button class="' + (RT.dash === 'meal' ? 'on' : '') + '" data-act="dash" data-v="meal">饮食打卡</button>' +
      '<button class="' + (RT.dash === 'ex' ? 'on' : '') + '" data-act="dash" data-v="ex">运动打卡</button></div></div>';

    if (RT.dash === 'ex') {
      html += '<p class="muted" style="margin:8px 0 10px">今天运动消耗 ' + E.r0(t.ex) + ' 千卡，记一笔会让「还可摄入」一起变化。</p>' +
        '<div class="chips">' +
        '<button class="chip" data-act="exercise" data-kcal="120">快走 30 分钟 +120</button>' +
        '<button class="chip" data-act="exercise" data-kcal="180">跳绳 15 分钟 +180</button>' +
        '<button class="chip" data-act="exercise" data-kcal="90">骑行 20 分钟 +90</button></div>' +
        '<button class="btn ghost" data-act="exclear">清空今天的运动记录</button>';
    } else {
      E.MEALS.forEach(function (m) {
        var items = (day.meals && day.meals[m]) || [];
        if (!items.length && m === '加餐') return;
        var mt = t.meals[m];
        html += '<div class="meal"><div class="meal-head"><span class="me" aria-hidden="true">' + MEAL_EMO[m] + '</span>' +
          '<h3>' + m + '</h3><span class="mk">' + E.r0(mt.kcal) + '/' + D.mealTargets[m] + '千卡</span></div>' +
          '<div class="food-list">' + (items.length
            ? items.map(function (it, i) { return foodRow(it, m, i); }).join('')
            : '<div class="empty">还没记录，点下面的按钮记一笔</div>') + '</div></div>';
      });
      html += '<div class="dash"></div><button class="btn primary" data-act="tab" data-tab="log">📝 一句话记饮食</button>';
    }
    html += '</section>';

    var counts = rs.counts;
    html += '<section class="card risk-card"><div class="risk-head"><span class="mascot" aria-hidden="true">🚨</span>' +
      '<h2 class="card-title">风险提示</h2><div class="risk-counts">' +
      '<span class="flag lv2">高糖 ' + counts['高糖'] + '</span>' +
      '<span class="flag lv3">高油 ' + counts['高油'] + '</span>' +
      '<span class="flag lv1">超加工 ' + counts['超加工'] + '</span></div></div>' +
      '<p class="muted" style="margin:8px 0 2px">依据公开膳食建议：' + esc(D.guidance.sugar) + '；' + esc(D.guidance.oil) + '。</p>';
    if (rs.list.length) {
      html += rs.list.map(function (f) {
        return '<div class="risk-row"><span class="flag lv' + f.level + '">' + f.kind + '</span>' +
          '<div class="rr-main"><div class="rr-n">' + esc(f.meal) + ' · ' + esc(f.item) + '</div>' +
          '<div class="rr-t">' + esc(f.text) + '</div></div></div>';
      }).join('');
    } else {
      html += '<div class="empty">今天没有高糖/高油/超加工标记，保持住 ✨</div>';
    }
    html += '<div class="dash"></div><p class="tiny">今日添加糖约 ' + E.fmt(rs.sugar) + ' 克（建议 &lt;25 克/天）· 超加工食品建议每周不超过 1~2 次</p>' +
      aiNote() + '</section>';

    return (RT.dayPick ? daypick() : '') + html;
  }
  function daypick() {
    var opts = [[0, '今天'], [-1, '昨天'], [-2, '前天']];
    return '<div class="daypick">' + opts.map(function (o) {
      return '<button class="' + (RT.day === o[0] ? 'on' : '') + '" data-act="day" data-day="' + o[0] + '">' + o[1] + ' ' + E.convDate(o[0]) + '</button>';
    }).join('') + '</div>';
  }

  /* ---------- 记录 ---------- */
  function viewLog() {
    var tpls = [
      '早餐：一杯咖啡+一个红枣吐司；午餐：西红柿炒鸡蛋90g+辣椒炒肉90g+米饭100g；晚餐：一个苹果',
      '午餐：黄焖鸡一份+米饭一碗',
      '晚餐：清炒时蔬+水煮蛋两个',
      '加餐：一杯无糖酸奶+一根香蕉'
    ];
    var html = '<section class="card"><div class="card-head"><span class="mascot" aria-hidden="true">🍙</span>' +
      '<h2 class="card-title">一句话记饮食<span class="uline"></span></h2></div>' +
      '<p class="muted" style="margin:6px 0 10px">像发消息一样说清楚吃了什么、吃了多少，我来拆成餐次和食物。</p>' +
      '<label class="sr-only" for="logText">这一餐吃了什么</label>' +
      '<textarea id="logText" class="ta" placeholder="例：早餐：一杯咖啡+一个红枣吐司；午餐：西红柿炒鸡蛋90g+米饭100g">' + esc(RT.logText) + '</textarea>' +
      '<div class="chips">' + tpls.map(function (t) {
        return '<button class="chip" data-act="tpl" data-txt="' + esc(t) + '">' + esc(t.length > 22 ? t.slice(0, 22) + '…' : t) + '</button>';
      }).join('') + '</div>' +
      '<button class="btn primary" data-act="parse">解析这一句</button></section>';

    if (RT.draft) {
      html += RT.draft.groups.map(function (g) {
        var sum = E.itemsTotals(g.items);
        var done = !!RT.draft.saved[g.meal];
        return '<section class="draft"><div class="draft-head">' +
          '<span class="dtag">' + E.dayLabel(RT.day) + ' ' + g.meal + ' ▾</span>' +
          '<button class="dtag" data-act="refill" aria-label="修改这句话">修改 ✏️</button>' +
          '<span class="mascot" style="margin-left:auto" aria-hidden="true">🐱</span></div>' +
          '<div class="food-list">' + g.items.map(function (it, i) { return draftRow(it, g.meal, i); }).join('') + '</div>' +
          '<div class="dash"></div><div class="draft-foot">' +
          '<span class="sum">🔥 ' + sum.kcal + ' 千卡 <small>蛋白 ' + E.fmt(sum.protein) + ' 克</small></span>' +
          '<button class="btn sm ' + (done ? 'ghost' : 'primary') + '" data-act="save" data-meal="' + esc(g.meal) + '"' +
          (done ? ' disabled' : '') + '>记录成功' + (done ? ' ✓' : '') + '</button></div>' +
          aiNote() + '</section>';
      }).join('');
      html += '<p class="tiny">保存同一餐次会覆盖今天该餐次的旧记录；点「记录成功」即写入本机存储。</p>';
    }

    var day = E.dayOf(state, RT.day);
    var t = E.dayTotals(day);
    var rows = E.MEALS.map(function (m) {
      var items = (day.meals && day.meals[m]) || [];
      return m + ' ' + items.length + ' 项 · ' + E.r0(t.meals[m].kcal) + ' 千卡';
    }).join('　｜　');
    html += '<section class="card soft"><h2 class="section-title">今天已记录</h2>' +
      '<p class="muted">' + rows + '</p><div class="dash"></div>' +
      '<p class="muted">合计 <b>' + E.r0(t.kcal) + ' 千卡</b> · 碳水 ' + E.fmt(t.carb) + '克 · 蛋白 ' + E.fmt(t.protein) + '克 · 脂肪 ' + E.fmt(t.fat) + '克</p>' +
      '<div style="margin-top:12px"><button class="btn line" data-act="tab" data-tab="today">回到今天看总览</button></div></section>';
    return html;
  }

  /* ---------- 配餐 ---------- */
  function viewPair() {
    var dishes = ['炸鸡', '麻辣烫', '黄焖鸡', '番茄牛腩'];
    var b = E.recipeStats(state);
    var html = '<section class="card"><div class="card-head"><span class="mascot" aria-hidden="true">🍱</span>' +
      '<h2 class="card-title">AI个性化配餐<span class="uline"></span></h2></div>' +
      '<p class="muted" style="margin:6px 0 10px">告诉我你想吃什么，我按「主食＋蛋白质＋蔬菜＋水果」帮你补齐这一餐。</p>' +
      '<label class="sr-only" for="pairText">想吃的菜</label>' +
      '<input id="pairText" class="ta" style="height:46px;min-height:0" value="' + esc(RT.pairText) + '" placeholder="比如：炸鸡 / 麻辣烫 / 黄焖鸡 / 番茄牛腩">' +
      '<div class="chips">' + dishes.map(function (d) {
        return '<button class="chip" data-act="pairfill" data-txt="' + d + '">' + d + '</button>';
      }).join('') + '</div>' +
      '<button class="btn primary" data-act="pair">生成配餐建议</button></section>';

    if (!RT.pair) {
      return html + '<section class="card soft"><h2 class="section-title">今天的审核状态</h2>' +
        '<span class="badge ' + (b.pending ? 'warn' : 'ok') + '">' + (b.pending ? '⏳ 营养师待审 ' + b.pending + ' 道' : '✅ 营养师已审核') + '</span>' +
        '<p class="muted" style="margin-top:8px">规则库里的菜谱卡需要营养师审核后才会进入推荐，' + E.badgeText(state) + '。</p>' +
        aiNote() + '</section>';
    }

    var p = RT.pair;
    var pct = Math.min(100, p.total / p.target * 100);
    var rows = p.canteen.map(function (c) {
      return '<div class="dish-row"><span class="tile" aria-hidden="true">' + c.emoji + '</span>' +
        '<div class="dish-main"><div class="dish-n">' + esc(c.name) +
        (c.oil >= 2 ? ' <span class="flag lv3">高油</span>' : '') + '</div>' +
        '<div class="dish-r">' + esc(c.reason) + '</div></div>' +
        '<div class="dish-meta"><b>¥' + E.fmt(c.price) + '</b>' + c.kcal + '千卡</div></div>';
    }).join('');
    var slots = p.slots.map(function (s) {
      return '<div class="slot"><div class="sl">' + s.label + '</div>' +
        '<div class="sn"><span aria-hidden="true">' + s.item.emoji + '</span><span>' + esc(s.item.name) + '</span></div>' +
        '<div class="sv">' + s.item.grams + '克 · ' + s.item.kcal + '千卡</div></div>';
    }).join('');

    html += '<section class="card"><div class="badge-line">' +
      '<span class="badge ' + (b.pending ? 'ok' : 'ok') + '">✅ 营养师已审核</span>' +
      '<span class="badge pink">' + esc(E.badgeText(state)) + '</span>' +
      '<button class="mini ghost" data-act="console">进入后台复核</button></div>' +
      '<div class="meal-head" style="padding:0 0 8px"><span class="me" aria-hidden="true">🍽</span><h3>你想吃：' + esc(p.main.name) + '</h3>' +
      '<span class="mk">' + p.main.kcal + '千卡</span></div>' + flagsOf(p.main) +
      '<div class="slots" style="margin-top:10px">' + slots + '</div>' +
      '<div class="dash"></div><div class="total-box"><div><div class="tiny">一餐合计</div><span class="big">' + p.total + '</span> <span class="muted">千卡</span></div>' +
      '<div class="goal">目标 ' + p.target + ' 千卡 · ' + (p.diff > 0 ? '超出 ' + p.diff : '还可 ' + (-p.diff)) + ' 千卡</div></div>' +
      '<div class="tbar ' + (p.diff > 0 ? 'over' : '') + '"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<div class="dash"></div><h3 class="section-title">食堂菜品推荐</h3>' + rows + '</section>';

    if (p.risks.length) {
      html += '<section class="card risk-card"><div class="warn-box"><span class="we" aria-hidden="true">⚠️</span><div>' +
        p.risks.map(function (r) { return '<div class="wt">' + r.kind + '提醒：' + esc(p.main.name) + '</div><p>' + esc(r.text) + '</p>'; }).join('') +
        '</div></div><div class="dash"></div><p class="muted">' + esc(D.guidance.sugar) + '；' + esc(D.guidance.oil) + '。</p></section>';
    }
    html += '<section class="card soft"><h3 class="section-title">搭配思路</h3><ul class="tips">' +
      p.notes.map(function (n, i) { return '<li><span class="no">' + (i + 1) + '</span><span>' + esc(n) + '</span></li>'; }).join('') +
      '</ul>' + aiNote() + '</section>';
    return html;
  }

  /* ---------- 周报 ---------- */
  function viewWeek() {
    var w = E.weekly(state);
    var maxK = w.days.reduce(function (a, d) { return Math.max(a, d.kcal); }, w.target) * 1.08;
    /* 数值标签单独一行放在绘图区之上，与虚线（绘图区内）永不重叠 */
    var vals = '<div class="vals">' + w.days.map(function (d) {
      return '<span class="bval">' + d.kcal + '</span>';
    }).join('') + '</div>';
    var bars = w.days.map(function (d) {
      var h = Math.max(2, d.kcal / maxK * 100);
      var cls = d.isToday ? 'today' : (d.kcal > w.target ? 'over' : '');
      return '<div class="bcol"><div class="bfill ' + cls + '" style="height:' + h.toFixed(1) + '%"></div></div>';
    }).join('');
    var tline = '<div class="tline" style="bottom:' + (w.target / maxK * 100).toFixed(1) + '%"></div>';
    var xlab = w.days.map(function (d) {
      return '<span class="' + (d.isToday ? 'on' : '') + '">' + d.label + '</span>';
    }).join('');
    var metrics = [
      { t: '平均摄入', n: w.avg, u: '千卡' },
      { t: '蛋白质达标天数', n: w.proteinOk + '/7', u: '天' },
      { t: '高糖/高油标记', n: w.flags, u: '次' },
      { t: '对比上周', n: (w.vsWeek > 0 ? '+' : '') + w.vsWeek, u: '%' }
    ].map(function (m) {
      return '<div class="metric"><div class="mt">' + m.t + '</div><div class="mn">' + m.n + '<small>' + m.u + '</small></div></div>';
    }).join('');
    var struct = w.structure.map(function (s) {
      return '<div class="struct"><div class="struct-top"><span>' + s.name + '</span><b>' + s.pct + '% <span class="tiny">建议 ' + s.band + '</span></b></div>' +
        '<div class="sbar"><i style="width:' + Math.min(100, s.pct) + '%;background:' + s.color + '"></i></div></div>';
    }).join('');
    var tips = w.suggestions.map(function (s, i) {
      return '<li><span class="no">' + (i + 1) + '</span><span>' + esc(s) + '</span></li>';
    }).join('');
    return '<section class="card"><div class="card-head"><span class="mascot" aria-hidden="true">📊</span>' +
      '<div><h2 class="card-title">本周饮食小结<span class="uline"></span></h2></div></div>' +
      '<div class="chart">' + vals + '<div class="bars">' + bars + tline + '</div><div class="xlab">' + xlab + '</div></div>' +
      '<p class="tiny" style="margin-top:8px">柱状为每天实际摄入；<b>绿色虚线</b>为推荐目标 ' + w.target + ' 千卡</p></section>' +
      '<section class="card"><h3 class="section-title">关键指标</h3><div class="metrics">' + metrics + '</div>' +
      '<p class="tiny" style="margin-top:10px">上周平均 ' + w.prev + ' 千卡；本周添加糖合计约 ' + E.fmt(w.sugar) + ' 克。</p></section>' +
      '<section class="card"><h3 class="section-title">饮食结构</h3>' + struct +
      '<p class="muted" style="margin-top:10px">按三大营养素供能比计算，建议碳水 50~65%、蛋白 10~20%、脂肪 20~30%。</p></section>' +
      '<section class="card"><h3 class="section-title">3 个可执行建议</h3><ul class="tips">' + tips + '</ul></section>' +
      '<section class="card soft"><div class="comment"><span class="ce" aria-hidden="true">🐱</span><div>' +
      '<h3 class="section-title">营养师点评</h3><p>' + esc(w.comment) + '</p></div></div>' + aiNote() + '</section>';
  }

  /* ---------- 提醒 ---------- */
  function viewRemind() {
    var rows = E.MEALS.map(function (m) {
      var r = state.reminders[m] || { on: false, time: '12:00' };
      var id = 'tm-' + m;
      return '<div class="remind-row"><span class="re" aria-hidden="true">' + MEAL_EMO[m] + '</span>' +
        '<div class="remind-main"><div class="rn">' + m + '提醒</div><div class="rt">' + (r.on ? '已开启，到点提醒' : '已关闭') + '</div></div>' +
        '<label class="sr-only" for="' + id + '">' + m + '提醒时间</label>' +
        '<input class="time-in" id="' + id + '" type="time" value="' + esc(r.time) + '" data-rtime="' + m + '">' +
        '<button class="switch" role="switch" data-act="rtoggle" data-meal="' + m + '" aria-checked="' + (r.on ? 'true' : 'false') + '"' +
        ' aria-label="' + m + '定时提醒开关"></button></div>';
    }).join('');
    var supported = ('Notification' in window);
    var granted = supported && window.Notification.permission === 'granted';
    var on = !!state.notify && granted;
    return '<section class="card"><div class="card-head"><span class="mascot" aria-hidden="true">⏰</span>' +
      '<div><h2 class="card-title">就餐定时提醒<span class="uline"></span></h2></div></div>' +
      '<p class="muted" style="margin:6px 0 4px">早餐 / 午餐 / 晚餐 / 加餐，各自开关和时间都能改。</p>' + rows +
      '<div class="dash"></div><button class="btn primary" data-act="testtoast">🔔 发送测试提醒</button></section>' +
      '<section class="card"><h3 class="section-title">通知与数据</h3>' +
      '<div class="setting-row"><div class="sm"><b>浏览器通知</b><p>' +
      (supported ? '当前权限：' + window.Notification.permission + '（只有点这个开关才会申请权限）' : '当前浏览器不支持系统通知，测试提醒会用页面提示') +
      '</p></div><button class="switch" role="switch" data-act="notify" aria-checked="' + (on ? 'true' : 'false') + '" aria-label="浏览器通知开关"></button></div>' +
      '<div class="setting-row"><div class="sm"><b>重置演示数据</b><p>恢复 7 天打卡、待审菜谱与规则开关的初始状态</p></div>' +
      '<button class="mini no" data-act="reset">重置</button></div>' +
      (RT.resetAsk ? '<div class="confirm-box"><p>确认重置？本机保存的打卡与审核结果都会回到初始演示状态。</p>' +
        '<div class="row2"><button class="mini yes" data-act="resetyes">确认重置</button>' +
        '<button class="mini ghost" data-act="resetno">取消</button></div></div>' : '') +
      '<div class="dash"></div><p class="tiny">提醒开关、时间与打卡记录都保存在本机 localStorage（键 shike.state.v1），不会上传到任何服务器。</p></section>';
  }

  /* ---------- 营养师后台 ---------- */
  function viewConsole() {
    var st = E.recipeStats(state);
    var list = state.recipes.slice().sort(function (a, b) {
      var w = { pending: 0, approved: 1, rejected: 2 };
      return w[a.status] - w[b.status];
    });
    var cards = list.map(function (r) {
      var tag = r.status === 'pending'
        ? '<span class="badge warn">待审</span>'
        : (r.status === 'approved' ? '<span class="badge ok">已通过</span>' : '<span class="badge pink">已驳回 · ' + esc(r.rejectReason || '未填原因') + '</span>');
      var acts = '';
      if (r.status === 'pending') {
        if (RT.rejectId === r.id) {
          acts = '<div class="recipe-acts">' + D.rejectReasons.map(function (why) {
            return '<button class="mini ghost" data-act="why" data-id="' + r.id + '" data-why="' + esc(why) + '">' + esc(why) + '</button>';
          }).join('') + '<button class="mini ghost" data-act="cancelreject">取消</button></div>';
        } else {
          acts = '<div class="recipe-acts"><button class="mini yes" data-act="approve" data-id="' + r.id + '">通过</button>' +
            '<button class="mini no" data-act="reject" data-id="' + r.id + '">驳回</button></div>';
        }
      }
      return '<div class="recipe"><div class="recipe-top"><b>' + esc(r.dish) + '</b>' + tag + '</div>' +
        '<div class="recipe-meta"><span>' + r.kcal + ' 千卡/份</span><span>蛋白 ' + r.protein + ' 克</span>' +
        '<span>油 ' + r.oil + ' 级</span></div>' +
        '<div class="rs">AI 理由：' + esc(r.reason) + '</div>' + acts + '</div>';
    }).join('');
    var rules = [
      ['highOilDownweight', '高油菜品自动降权重', '配餐推荐里油脂等级高的菜排后面'],
      ['proteinFirst', '蛋白质优先', '优先补足这一餐的蛋白质缺口'],
      ['canteenFirst', '食堂菜品优先', '优先推荐校内食堂在售菜品'],
      ['ultraProcessBlock', '超加工食材拦截', '含超加工食材的菜品直接不进推荐']
    ].map(function (x) {
      return '<div class="rule-row"><div class="rr"><b>' + x[1] + '</b><p>' + x[2] + '</p></div>' +
        '<button class="switch" role="switch" data-act="rule" data-key="' + x[0] + '" aria-checked="' + (state.rules[x[0]] ? 'true' : 'false') + '" aria-label="' + x[1] + '"></button></div>';
    }).join('');
    return '<section class="card"><div class="stats">' +
      '<div class="stat"><div class="sn">' + st.pending + '</div><div class="st">待审</div></div>' +
      '<div class="stat"><div class="sn">' + st.approved + '</div><div class="st">已通过</div></div>' +
      '<div class="stat"><div class="sn">' + st.rate + '%</div><div class="st">驳回率</div></div></div>' +
      '<p class="tiny" style="margin-top:10px">共 ' + st.total + ' 张菜谱卡，其中驳回 ' + st.rejected + ' 张。</p></section>' +
      '<section class="card"><h3 class="section-title">待审菜谱队列</h3>' + cards + '</section>' +
      '<section class="card"><h3 class="section-title">推荐规则</h3>' + rules + '</section>' +
      '<section class="card soft"><h3 class="section-title">说明</h3>' +
      '<p class="muted">这是演示用的审核台：菜谱由本地规则引擎生成，通过 / 驳回的结果只保存在本机，并会改变配餐页的「营养师已审核」徽标。</p>' +
      aiNote() + '</section>';
  }

  /* ---------- 渲染 ---------- */
  var VIEWS = { today: viewToday, log: viewLog, pair: viewPair, week: viewWeek, remind: viewRemind, console: viewConsole };
  var NAMES = { today: '今天', log: '记录', pair: '配餐', week: '周报', remind: '提醒', console: '营养师后台' };
  function paint() {
    document.getElementById('topbar').innerHTML = topbar();
    document.getElementById('view').innerHTML = '<h1 class="sr-only">食刻 · ' + (NAMES[RT.tab] || '今天') + '</h1>' +
      (VIEWS[RT.tab] || viewToday)();
    document.getElementById('tabbar').innerHTML = tabbar();
  }

  /* ---------- 交互 ---------- */
  function recipe(id) {
    return state.recipes.filter(function (r) { return r.id === id; })[0] || null;
  }
  function findByMeal(meal, i, items) { return items[i] || null; }
  function dayItems(meal) {
    return (E.dayOf(state, RT.day).meals || {})[meal] || [];
  }
  function detail(it) {
    if (!it) return;
    var risk = E.riskOf(it).map(function (r) { return r.kind; }).join('/');
    toast(it.name + ' · ' + it.kcal + '千卡 ' + it.qty + it.unit + ' · 碳水' + E.fmt(it.carb) + '克 蛋白' + E.fmt(it.protein) + '克 脂肪' + E.fmt(it.fat) + '克' + (risk ? ' · 标记：' + risk : ''));
  }
  function parseNow() {
    var text = RT.logText.trim();
    if (!text) { toast('先写下这一餐吃了什么吧～'); return; }
    var groups = E.parseSentence(text);
    if (!groups.length) { toast('没读懂这一句，试试「早餐：一杯咖啡+一个吐司」'); return; }
    RT.draft = { groups: groups, saved: {}, sentence: text };
    paint();
    toast('已解析出 ' + groups.length + ' 个餐次，确认后点「记录成功」');
  }
  function saveDraft(meal) {
    if (!RT.draft) return;
    var g = RT.draft.groups.filter(function (x) { return x.meal === meal; })[0];
    if (!g) return;
    var key = E.dateKey(RT.day);
    if (!state.days[key]) state.days[key] = E.emptyDay();
    if (!state.days[key].meals) state.days[key].meals = {};
    var old = state.days[key].meals[meal] || [];
    state.days[key].meals[meal] = meal === '加餐' ? old.concat(g.items) : g.items.slice();
    RT.draft.saved[meal] = true;
    save();
    paint();
    var t = E.dayTotals(state.days[key]);
    toast('记录成功，' + E.dayLabel(RT.day) + '合计 ' + E.r0(t.kcal) + ' 千卡');
  }
  function toggleRule(key) {
    state.rules[key] = !state.rules[key];
    save();
    paint();
    toast('已' + (state.rules[key] ? '开启' : '关闭') + '该推荐规则');
  }
  function toggleNotify() {
    var supported = ('Notification' in window);
    if (!supported) { toast('当前浏览器不支持系统通知，测试提醒会用页面提示'); return; }
    if (state.notify && window.Notification.permission === 'granted') {
      state.notify = false; save(); paint();
      toast('已关闭系统通知提醒（浏览器权限仍保留，可在站点设置里改）');
      return;
    }
    if (window.Notification.permission === 'granted') {
      state.notify = true; save(); paint(); toast('系统通知已开启');
      return;
    }
    if (window.Notification.permission === 'denied') {
      toast('浏览器此前已拒绝通知权限，请在地址栏左侧的锁形图标里改为允许');
      return;
    }
    try {
      var p = window.Notification.requestPermission();
      if (p && typeof p.then === 'function') {
        p.then(function (res) {
          state.notify = res === 'granted';
          save(); paint();
          toast(res === 'granted' ? '系统通知已开启' : '没有拿到通知权限，测试提醒仍会用页面提示');
        })['catch'](function () {
          toast('通知权限申请失败，测试提醒仍可用页面提示');
        });
      } else {
        toast('已发出通知权限申请，请在浏览器弹窗里允许');
      }
    } catch (err) {
      toast('通知权限申请失败，测试提醒仍可用页面提示');
    }
  }
  function testReminder() {
    var on = E.MEALS.filter(function (m) { return state.reminders[m] && state.reminders[m].on; });
    if (!on.length) { toast('还没有开启任何提醒，先把至少一餐的开关打开吧'); return; }
    var first = on[0];
    toast('测试提醒 · ' + first + ' ' + state.reminders[first].time + ' 到点啦，记得好好吃饭 🍚');
  }

  function onClick(ev) {
    var btn = ev.target.closest('[data-act]');
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    if (act === 'tab') { go(btn.getAttribute('data-tab')); return; }
    if (act === 'console') { RT.tab = 'console'; RT.rejectId = ''; paint(); return; }
    if (act === 'back') { go('today'); return; }
    if (act === 'daypick') { RT.dayPick = !RT.dayPick; paint(); return; }
    if (act === 'day') { RT.day = parseInt(btn.getAttribute('data-day'), 10) || 0; RT.dayPick = false; paint(); return; }
    if (act === 'dash') { RT.dash = btn.getAttribute('data-v'); paint(); return; }
    if (act === 'food') {
      detail(findByMeal(btn.getAttribute('data-meal'), parseInt(btn.getAttribute('data-i'), 10), dayItems(btn.getAttribute('data-meal'))));
      return;
    }
    if (act === 'dfood') {
      var me = btn.getAttribute('data-meal');
      var gi = RT.draft ? RT.draft.groups.filter(function (g) { return g.meal === me; })[0] : null;
      if (gi) detail(gi.items[parseInt(btn.getAttribute('data-i'), 10)]);
      return;
    }
    if (act === 'exercise') {
      var key = E.dateKey(RT.day);
      if (!state.days[key]) state.days[key] = E.emptyDay();
      state.days[key].ex = (state.days[key].ex || 0) + parseInt(btn.getAttribute('data-kcal'), 10);
      save(); paint();
      toast('已记录运动，消耗 +' + btn.getAttribute('data-kcal') + ' 千卡');
      return;
    }
    if (act === 'exclear') {
      var k2 = E.dateKey(RT.day);
      if (!state.days[k2]) state.days[k2] = E.emptyDay();
      state.days[k2].ex = 0; save(); paint(); toast('已清空今天的运动记录');
      return;
    }
    if (act === 'tpl') { RT.logText = btn.getAttribute('data-txt'); paint(); return; }
    if (act === 'parse') { parseNow(); return; }
    if (act === 'refill') {
      if (RT.draft) { RT.logText = RT.draft.sentence; RT.draft = null; paint(); }
      var ta = document.getElementById('logText');
      if (ta) ta.focus();
      return;
    }
    if (act === 'save') { saveDraft(btn.getAttribute('data-meal')); return; }
    if (act === 'pairfill') {
      RT.pairText = btn.getAttribute('data-txt');
      RT.pair = E.pairPlan(RT.pairText, state.rules);
      paint();
      return;
    }
    if (act === 'pair') {
      var input = document.getElementById('pairText');
      var val = (input ? input.value : RT.pairText).trim() || '炸鸡';
      RT.pairText = val;
      RT.pair = E.pairPlan(val, state.rules);
      paint();
      toast('已按「主食＋蛋白＋蔬菜＋水果」生成配餐：' + RT.pair.main.name);
      return;
    }
    if (act === 'rtoggle') {
      var m = btn.getAttribute('data-meal');
      state.reminders[m].on = !state.reminders[m].on;
      save(); paint();
      toast(m + '提醒已' + (state.reminders[m].on ? '开启（' + state.reminders[m].time + '）' : '关闭'));
      return;
    }
    if (act === 'testtoast') { testReminder(); return; }
    if (act === 'notify') { toggleNotify(); return; }
    if (act === 'reset') { RT.resetAsk = true; paint(); return; }
    if (act === 'resetno') { RT.resetAsk = false; paint(); return; }
    if (act === 'resetyes') {
      state = E.resetState();
      state.notify = false;
      RT.draft = null; RT.pair = null; RT.logText = ''; RT.pairText = ''; RT.resetAsk = false; RT.day = 0;
      save(); paint(); toast('演示数据已重置');
      return;
    }
    if (act === 'approve') {
      var r = recipe(btn.getAttribute('data-id'));
      if (!r) return;
      r.status = 'approved'; r.rejectReason = '';
      save(); paint();
      toast('已通过「' + r.dish + '」，配餐徽标已更新');
      return;
    }
    if (act === 'reject') { RT.rejectId = btn.getAttribute('data-id'); paint(); return; }
    if (act === 'cancelreject') { RT.rejectId = ''; paint(); return; }
    if (act === 'why') {
      var r2 = recipe(btn.getAttribute('data-id'));
      if (!r2) return;
      r2.status = 'rejected';
      r2.rejectReason = btn.getAttribute('data-why');
      RT.rejectId = '';
      save(); paint();
      toast('已驳回「' + r2.dish + '」：' + r2.rejectReason);
      return;
    }
    if (act === 'rule') { toggleRule(btn.getAttribute('data-key')); return; }
  }
  function onInput(ev) {
    if (ev.target.id === 'logText') RT.logText = ev.target.value;
    if (ev.target.id === 'pairText') RT.pairText = ev.target.value;
  }
  function onChange(ev) {
    var m = ev.target.getAttribute && ev.target.getAttribute('data-rtime');
    if (!m) return;
    state.reminders[m].time = ev.target.value || state.reminders[m].time;
    save();
    toast(m + '提醒时间已改为 ' + state.reminders[m].time);
  }
  function boot() {
    state = E.loadState();
    if (typeof state.notify !== 'boolean') state.notify = false;
    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    document.addEventListener('change', onChange);
    paint();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
